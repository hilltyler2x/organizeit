name: Tell Bing about new pages

# After the guide pages change on main, wait for Render to deploy them, then send every URL in
# the sitemap to IndexNow (Bing, plus Yandex, Seznam and others). ChatGPT search leans on Bing's
# index. Google doesn't use IndexNow; it reads sitemap.xml from Search Console.
on:
  push:
    branches: [main]
    paths: [public/sitemap.xml, public/guides/**, public/robots.txt, index.html, scripts/seo/**]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    env:
      SITE: https://organizeit-93mu.onrender.com
      HOST: organizeit-93mu.onrender.com
      KEY: 677508c18733ae600396889b0bcec286
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the deploy (the key file and the newest sitemap are live)
        run: |
          want=$(md5sum public/sitemap.xml | cut -d' ' -f1)
          for i in $(seq 1 40); do
            key=$(curl -s --max-time 90 "$SITE/$KEY.txt" || true)
            live=$(curl -s --max-time 90 "$SITE/sitemap.xml" | md5sum | cut -d' ' -f1)
            if [ "$key" = "$KEY" ] && [ "$live" = "$want" ]; then echo "Deployed"; exit 0; fi
            echo "Not deployed yet ($i)"; sleep 30
          done
          echo "Deploy didn't show up in 20 minutes"; exit 1
      - name: Send the sitemap URLs to IndexNow
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' public/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          body=$(jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          echo "$body"
          code=$(curl -s -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          cat resp.txt; echo "IndexNow answered $code"
          [ "$code" = 200 ] || [ "$code" = 202 ]
